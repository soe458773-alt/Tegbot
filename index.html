<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Video - Watch Ad to View</title>
    <!-- 🌟 Social Bar Script (အပေါ်ဆုံးတွင် အမြဲပေါ်နေစေရန်) -->
    <script src="https://pl31393019.profitableratecpmnetwork.com/7c/4a/6b/7c4a6b89e4307c82961c96335d98c7bd.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; padding-top: 70px; }
        .video-box { display: none; margin-top: 20px; }
        video { width: 100%; max-width: 500px; border-radius: 8px; }
        .btn { background: #ff4757; color: white; border: none; padding: 14px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; display: inline-block; font-weight: bold; }
        .unlock-note { color: #2ed573; margin-top: 15px; font-size: 14px; }
        #timer-text { font-size: 18px; color: #ffa502; margin: 15px 0; font-weight: bold; }
        .video-title { font-size: 18px; color: #ff4757; margin-bottom: 15px; font-weight: bold; }
        #videoPoster { width: 100%; max-width: 300px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .banner-container { margin: 15px 0; }
    </style>
</head>
<body>

    <!-- 🌐 Sticky / Overlay AAds ကြော်ငြာ (2455685 - ပိတ်စရာ အမှန်ခြစ်ခလုတ်ပါဝင်သည်) -->
    <div style="position: absolute; z-index: 99999">
      <input autocomplete="off" type="checkbox" id="aadsstickymu7tk2s7" hidden />
      <div style="padding-top: auto; padding-bottom: 0;">
        <div style="width:100%; height:auto; position:fixed; text-align:center; font-size:0; top:0; left:0; right:0; margin:auto; background: rgba(18, 18, 18, 0.95); padding-top: 5px;">
          <label for="aadsstickymu7tk2s7" style="top: 50%; transform: translateY(-50%); right: 24px; position: absolute; border-radius: 4px; background: rgba(248, 248, 249, 0.70); padding: 4px; z-index: 99999; cursor: pointer;">
            <svg fill="#000000" height="16px" width="16px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490">
              <polygon points="456.851,0 245,212.564 33.149,0 0.708,32.337 212.669,245.004 0.708,457.678 33.149,490 245,277.443 456.851,490 489.292,457.678 277.331,245.004 489.292,32.337 "/>
            </svg>
          </label>
          <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
            <iframe data-aa='2455685' src='//acceptable.a-ads.com/2455685/?size=Adaptive' style='border:0; padding:0; width:70%; height:auto; overflow:hidden; margin: auto'></iframe>
          </div>
        </div>
        <style>
          #aadsstickymu7tk2s7:checked + div {
            display: none;
          }
        </style>
      </div>
    </div>

    <h2>🎬 Smile Video Player</h2>
    
    <!-- ဗီဒီယိုခေါင်းစဉ် -->
    <div id="videoTitle" class="video-title">📌 တင်ထားသော ဗီဒီယို</div>

    <!-- ဗီဒီယိုပုံ (Thumbnail) ပေါ်မည့်နေရာ -->
    <img id="videoPoster" src="" alt="Video Thumbnail">

    <!-- 🌟 Banner Ad (High Revenue Format) ထည့်သွင်းသည့်နေရာ -->
    <div class="banner-container">
        <script>
          atOptions = {
            'key' : '2f3f10a1dc46ca2b98e8dea521d1a4b9',
            'format' : 'iframe',
            'height' : 60,
            'width' : 468,
            'params' : {}
          };
        </script>
        <script src="https://www.highrevenueformat.com/2f3f10a1dc46ca2b98e8dea521d1a4b9/invoke.js"></script>
    </div>

    <p>ဗီဒီယိုကြည့်ရှုရန် အောက်ပါခလုတ်ကို နှိပ်ပြီး ၁၅ စက္ကန့် စောင့်ဆိုင်းပါ</p>

    <div style="margin: 20px 0;">
        <button id="adBtn" onclick="openAdAndStartTimer()" class="btn">🔗 ကြော်ငြာဖွင့်ရန် နှိပ်ပါ</button>
    </div>

    <div id="timer-container" style="display: none;">
        <p id="timer-text">⏳ ကြော်ငြာကြည့်ရှုနေသည်... (15 စက္ကန့်)</p>
    </div>

    <div id="videoBox" class="video-box">
        <p class="unlock-note">✅ အချိန်ပြည့်သွားပါပြီ။ ဗီဒီယို စတင်နေပါပြီ...</p>
        <video id="videoPlayer" controls autoplay>
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v');
        const caption = urlParams.get('caption');
        const posterUrl = urlParams.get('thumb');

        if (caption) {
            document.getElementById('videoTitle').innerText = "📌 " + decodeURIComponent(caption);
        }

        if (posterUrl) {
            const posterImg = document.getElementById('videoPoster');
            posterImg.src = decodeURIComponent(posterUrl);
            posterImg.style.display = 'inline-block';
        }

        // 🔗 ကြော်ငြာလင့်ခ်များ (ခလုတ်နှိပ်လျှင် Rotation ဖြင့် အလှည့်ကျပွင့်မည်)
        const adLinks = [
            "https://www.profitableratecpmnetwork.com/iebcxip3ei?key=eddc6695e1715ccf6cebce8f9f3325b7",
            "https://www.profitableratecpmnetwork.com/zez2vi1ps?key=ea48f5ba2dcd1a2a9088a5e35df3c45f"
        ];

        function openAdAndStartTimer() {
            let currentIndex = localStorage.getItem('ad_index') ? parseInt(localStorage.getItem('ad_index')) : 0;
            let selectedAd = adLinks[currentIndex];
            currentIndex = (currentIndex + 1) % adLinks.length;
            localStorage.setItem('ad_index', currentIndex);

            window.open(selectedAd, '_blank');

            document.getElementById('adBtn').style.display = 'none';
            document.getElementById('timer-container').style.display = 'block';

            let timeLeft = 15;
            let timerElem = document.getElementById('timer-text');

            let countdown = setInterval(function() {
                timeLeft--;
                timerElem.innerText = `⏳ ကျန်ရှိသောအချိန်: ${timeLeft} စက္ကန့်`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    document.getElementById('timer-container').style.display = 'none';
                    
                    const videoBox = document.getElementById('videoBox');
                    const videoPlayer = document.getElementById('videoPlayer');

                    if (videoUrl) {
                        videoBox.style.display = 'block';
                        videoPlayer.src = videoUrl;
                        videoPlayer.play().catch(e => console.log("Auto-play blocked:", e));
                    } else {
                        videoBox.style.display = 'block';
                        alert('ဗီဒီယို လင့်ခ် အချက်အလက် မရှိပါ။');
                    }
                }
            }, 1000);
        }
    </script>
</body>
</html>
