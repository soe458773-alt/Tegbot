<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Video - Watch Ad to View</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .video-box { display: none; margin-top: 20px; }
        video { width: 100%; max-width: 500px; border-radius: 8px; }
        .btn { background: #ff4757; color: white; border: none; padding: 14px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; display: inline-block; font-weight: bold; }
        .unlock-note { color: #2ed573; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <h2>🎬 Smile Video Player</h2>
    <p>ဗီဒီယိုကြည့်ရှုရန် အောက်ပါခလုတ်ကို နှိပ်ပါ</p>

    <div style="margin: 30px 0;">
        <button onclick="openAdAndUnlock()" class="btn">🔗 ကြော်ငြာဖွင့်ရန် နှိပ်ပါ</button>
    </div>

    <div id="videoBox" class="video-box">
        <p class="unlock-note">✅ ကြော်ငြာဖွင့်ပြီးပါပြီ။ အောက်တွင် ဗီဒီယိုကို ကြည့်ရှုနိုင်ပါပြီ။</p>
        <video id="videoPlayer" controls autoplay>
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v');

        // ကြော်ငြာလင့်ခ် ၂ ခုကို အလှည့်ကျပွင့်စေရန် Array ထဲတွင် ထည့်ထားခြင်း
        const adLinks = [
            "https://www.profitableratecpmnetwork.com/awvebhi3?key=c75d0b00b2d132a7844f91d41151f465",
            "https://www.profitableratecpmnetwork.com/qpajwd18v3?key=7ac499a6f89a5d90174baec284ad186b"
        ];

        function openAdAndUnlock() {
            // LocalStorage ကိုသုံးပြီး နှိပ်တိုင်း လင့်ခ်အလှည့်ကျ ပြောင်းလဲစေရန်
            let currentIndex = localStorage.getItem('ad_index') ? parseInt(localStorage.getItem('ad_index')) : 0;
            
            // လက်ရှိအလှည့်ကျ လင့်ခ်ကို ယူမည်
            let selectedAd = adLinks[currentIndex];

            // နောက်တစ်ခါနှိပ်လျှင် နောက်လင့်ခ်တစ်ခုသို့ ပြောင်းရန် Index ကို တိုးမည်
            currentIndex = (currentIndex + 1) % adLinks.length;
            localStorage.setItem('ad_index', currentIndex);

            // ကြော်ငြာလင့်ခ်ကို အသစ်ဖွင့်မည်
            window.open(selectedAd, '_blank');

            // ဗီဒီယို Player ကို ပေါ်လာစေရန်
            const videoBox = document.getElementById('videoBox');
            const videoPlayer = document.getElementById('videoPlayer');

            if (videoUrl) {
                videoBox.style.display = 'block';
                videoPlayer.src = videoUrl;
            } else {
                videoBox.style.display = 'block';
                alert('ဗီဒီယို လင့်ခ် အချက်အလက် မရှိပါ။');
            }
        }
    </script>
</body>
</html>
