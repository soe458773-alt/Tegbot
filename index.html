<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smile Video - Watch Ad to View</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #111; 
            color: #fff; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        #ad-section { 
            margin-top: 40px; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #video-section { 
            display: none; 
            margin-top: 20px; 
        }
        .btn { 
            background: #0088cc; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            margin-top: 15px;
            font-weight: bold;
        }
        .btn:hover { background: #0077b3; }
        #timer { color: #ffcc00; font-weight: bold; font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- ကြော်ငြာပြမည့် အပိုင်း -->
    <div id="ad-section">
        <h3>📢 ဗီဒီယိုကြည့်ရှုရန် ကြော်ငြာကို အရင်ကြည့်ပါ</h3>
        <p>ကျေးဇူးပြု၍ အောက်ပါ ကြော်ငြာလင့်ခ်ကို နှိပ်ပြီး ခဏစောင့်ပါ (သို့) ကြော်ငြာပြီးဆုံးပါက ဗီဒီယို အလိုအလျောက် ပွင့်လာပါမည်။</p>
        
        <!-- ထည့်ပေးလိုက်သော Ad Link -->
        <a href="https://www.profitableratecpmnetwork.com/ket1i5d7eg?key=4fd15bb6bdffdc535b455feca70aab53" target="_blank" id="ad-link" class="btn" onclick="startUnlockTimer()">ကြော်ငြာကြည့်မည် (Click Here)</a>
        
        <div id="timer" style="display: none;">ကျေးဇူးပြု၍ <span>5</span> စက္ကန့် စောင့်ပါ...</div>
    </div>

    <!-- ဗီဒီယိုပြမည့် အပိုင်း (ကြော်ငြာကြည့်ပြီးမှ ပေါ်မည်) -->
    <div id="video-section">
        <h3>🎬 သင် တောင်းဆိုထားသော ဗီဒီယို</h3>
        <div id="player-container">
            <iframe id="video-frame" width="100%" height="250px" src="" frameborder="0" allowfullscreen style="border-radius: 8px;"></iframe>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        function startUnlockTimer() {
            const timerDiv = document.getElementById('timer');
            const timerSpan = timerDiv.querySelector('span');
            timerDiv.style.display = 'block';
            
            let timeLeft = 5; // ၅ စက္ကန့် စောင့်ပြီး ဗီဒီယိုပွင့်မည်
            
            let countdown = setInterval(() => {
                timeLeft--;
                timerSpan.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    unlockVideo();
                }
            }, 1000);
        }

        function unlockVideo() {
            document.getElementById('ad-section').style.display = 'none';
            document.getElementById('video-section').style.display = 'block';
            
            if (videoId) {
                document.getElementById('video-frame').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } else {
                document.getElementById('player-container').innerHTML = '<p style="color: red;">ဗီဒီယို လင့်ခ် မရှိပါ။</p>';
            }
        }
    </script>
</body>
</html>
